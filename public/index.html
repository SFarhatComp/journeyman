<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FootFinder</title>
  <link rel="preload" href="/fonts/oswald-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="notice" hidden></div>
  <header><h1>FootFinder</h1><span id="phase"></span><span id="timer"></span></header>

  <main>
    <section id="screen-home">
      <p class="tagline">Claim a club. Name one footballer who links them all.</p>
      <input id="nickname" placeholder="Your name" maxlength="24" autocomplete="off"
             autocapitalize="words" enterkeyhint="done">
      <button id="create">Create room</button>
      <p class="or"><span>or join one</span></p>
      <div class="row">
        <input id="join-code" placeholder="Room code" maxlength="6" autocomplete="off"
               autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go">
        <button id="join">Join</button>
      </div>
    </section>

    <section id="screen-lobby" hidden>
      <span class="lbl">Room code</span>
      <strong id="room-code"></strong>
      <button id="share" class="ghost">Share invite link</button>
      <div class="lobby-head">
        <span class="lbl">In the room</span>
        <span id="lobby-count" class="count"></span>
      </div>
      <ul id="lobby-players"></ul>
      <button id="start" hidden>Start game</button>
      <p id="lobby-note"></p>
    </section>

    <section id="screen-picking" hidden>
      <p>Pick a club — taken ones are locked.</p>
      <div id="club-grid"></div>
    </section>

    <section id="screen-answering" hidden>
      <div class="round-bar"><span class="live-dot"></span><h2 id="round-no">Round 1</h2></div>
      <p class="prompt">Name one footballer who played for</p>
      <ul id="round-clubs"></ul>
      <input id="answer" placeholder="Search a footballer" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <ul id="suggestions"></ul>
      <p id="answer-status"></p>
      <div class="status-strip"><span class="lbl">Submitted</span><ul id="submitted"></ul></div>
    </section>

    <section id="screen-reveal" hidden>
      <h2 id="reveal-no" class="reveal-no">Round 1</h2>
      <div id="best-answer" class="best"></div>
      <ul id="results"></ul>
    </section>

    <section id="screen-final" hidden>
      <h2 class="whistle">Full time</h2>
      <ol id="podium"></ol>
      <ol id="standings"></ol>
      <button id="play-again" hidden>Play again</button>
      <p id="final-note"></p>
    </section>
  </main>

  <div id="live">
    <ul id="scoreboard"></ul>
    <button id="end-game" hidden>End game</button>
  </div>

  <script type="module" src="/app.js"></script>
  <div id="confetti" aria-hidden="true"></div>
</body>
</html>
